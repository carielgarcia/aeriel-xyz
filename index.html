<style>
/* Layout: oversized name and subtitle on the ground, then a three-column wall of scans shown whole. Tokens follow the ÆRIEL design system, Night first, Paper second. */
:root{--surface-100:#1a1a1a;--surface-200:#262626;--line:#767676;--line-subtle:#3a3a3a;--ink:#ffffff;--ink-muted:#b8b8b8;--pink:#f5386c;--pink-text:#ff5c88;--on-pink:#1a1a1a;--focus:#f5e12e;--font-sans:"Archivo","Helvetica Neue",Arial,sans-serif;--font-mono:"DM Mono",ui-monospace,Menlo,monospace;--space-2:8px;--space-3:12px;--space-4:16px;--space-8:32px;--space-12:48px;--space-16:64px;--shadow-print:0 1px 2px rgba(0,0,0,.35),0 14px 32px rgba(0,0,0,.4);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--surface-100:#f8f1dc;--surface-200:#ffffff;--line:#1a1a1a;--line-subtle:#d9cfae;--ink:#1a1a1a;--ink-muted:#4a4a4a;--pink-text:#c4123f;--focus:#1a1a1a;--shadow-print:0 1px 2px rgba(0,0,0,.25),0 12px 28px rgba(0,0,0,.2);color-scheme:light}}
:root[data-theme="light"]{--surface-100:#f8f1dc;--surface-200:#ffffff;--line:#1a1a1a;--line-subtle:#d9cfae;--ink:#1a1a1a;--ink-muted:#4a4a4a;--pink-text:#c4123f;--focus:#1a1a1a;--shadow-print:0 1px 2px rgba(0,0,0,.25),0 12px 28px rgba(0,0,0,.2);color-scheme:light}
body{background:var(--surface-100);color:var(--ink);font:400 16px/24px var(--font-sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--space-12)}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-16)}
header{position:relative;display:flex;flex-direction:column;gap:var(--space-4);padding-top:var(--space-8);min-width:0}
.dots{position:absolute;top:0;right:0;width:clamp(72px,16vw,176px);aspect-ratio:1;border-radius:50%;background-image:radial-gradient(circle,var(--pink) 0 24%,transparent 26%);background-size:16px 16px}
h1{margin:0;font:900 clamp(72px,20vw,260px)/.88 var(--font-sans);letter-spacing:-.035em;color:var(--ink)}
.sub{margin:0;font:800 clamp(28px,5vw,56px)/1 var(--font-sans);letter-spacing:-.01em;color:var(--pink-text)}
.meta{margin:0;font:500 11px/14px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.wall{columns:3 340px;column-gap:var(--space-8)}
figure{margin:0 0 var(--space-8);break-inside:avoid;display:flex;flex-direction:column;gap:var(--space-2)}
figure img{display:block;width:100%;height:auto}
figure.print img{border-radius:2px;box-shadow:var(--shadow-print)}
footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-4);border-top:1px solid var(--line-subtle);padding-top:var(--space-8)}
footer svg{height:40px;width:auto;fill:var(--ink)}
a{color:var(--pink-text)}a:focus-visible,img:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
@media (max-width:520px){.wall{columns:1}}
</style>
</head>
